name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust (tests, lint, docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust 1.85 (the declared minimum)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked --no-run

  vectors:
    name: Known-answer vectors, re-derived independently
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: python3 tools/check_vectors.py

  ui:
    name: UI (typecheck and build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm install -g npm@11.12.1   # the version pinned in package.json
      - run: npm ci
      - run: npm run build

  guardrails:
    name: Repo rules checked as code (loopback only, no .env, no mainnet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/guardrails.sh

  mutation:
    name: Every defence still has a test that notices when it is removed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/mutate-new.sh

# Not run here: the regtest settlement scripts (scripts/demo*.sh, scripts/run.sh). They need
# Docker, QEDIT's swap-enabled Zebra image (about 15 minutes to build) and the wallet tool.
