[package]
name = "kalyptra-node"
version = "0.1.0"
description = "Kalyptra matcher node over HTTP, plus the client and checker command line."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "kalyptra"
path = "src/main.rs"

[dependencies]
kalyptra-tse = { path = "../kalyptra-tse" }
kalyptra-matcher = { path = "../kalyptra-matcher" }
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# small, synchronous HTTP: no async runtime, no TLS (local demo only)
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
