[package]
name = "kalyptra-tse"
version = "0.1.0"
description = "Threshold sealed envelopes: encrypt to a group key that no single node holds, decrypt with any t of n proven partial decryptions."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Entry points with caller-chosen randomness, and attack simulations. Tests and the
# known-answer vectors only. Never enable in a build that handles real data.
test-vectors = []

[dependencies]
# Distributed key generation and share handling. Audited in part (NCC), by the Zcash Foundation.
frost-ristretto255 = "3.0.0"
# Pinned to exactly the version FROST uses, so point and scalar types are identical.
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "digest", "zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
# The crate itself with `test-vectors` on, so tests and examples see the test-only entry
# points while normal builds do not.
kalyptra-tse = { path = ".", features = ["test-vectors"] }
